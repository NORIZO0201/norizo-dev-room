## 0. 技術概要

CWS 2.0 は Impulse/Bold テーマを**置き換えていない**。Impulseのファイル216本をそのまま残したうえで、
`layout/theme.liquid` を差し替えて **Impulse の実行経路を丸ごと切り離し**、`cws2-*` 97ファイルの独立レイヤーへ
描画責務を移した構成になっている。

結果として、CWS 2.0 PREVIEW の313ファイルのうち**実行経路に乗っているのは147ファイル**、
**109ファイルが到達不能**、13ファイルが実行経路未検出ファイル、9ファイルがバックアップ、27ファイルが運用・データ用となる。
到達不能109ファイルの大半は Impulse 基盤そのもの（`theme.css` 218KB / `theme.js` 216KB / `theme.min.js` 187KB /
`vendor-scripts-v9.js` 117KB と、Impulse標準section/snippet群）で、**約1.1MBのコードが配信も実行もされていない**。

構造上の主要点は次の5点である。

1. **`layout/theme.liquid` が唯一の分岐点**。9006B→4448B に縮小したこのファイルが、Impulse基盤を読まず
   `cws2-*` CSS 9本 + JS 3本だけを読む。CWS 2.0の実行経路はこのファイルを起点とする。
2. **Impulse の JS は意図的に無効化されている**。`theme.min.js` は `window.theme.settings` ブートストラップを必要とするが
   2.0のlayoutはそれを出力しないため、読み込んでも即 TypeError で停止する。ファイル内コメントにもその旨が明記されている。
3. **検索は alternate template をデータAPIとして使う構造**。`collection.cws2SearchIndex` / `cws2AliasIndex` / `cws2MapIndex` は
   画面ではなくJSONを返し、`cws2-search.js` などが `fetch('?view=...')` で取得する。参照0に見えても**実行時参照あり**。
4. **カートは13枚のCSSを積層している**。うち `cws2-cart-layout-a.css` は全宣言が後続に上書きされ描画に寄与しない。
   残りは別DOM責務であり、単純な世代重複ではない（本書5章で宣言単位に判定）。
5. **MAINにあった計測・越境決済タグが2.0の実行経路から消えている**（Google Analytics / GTM / WorldShopping / Facebook ドメイン認証）。
   CWS 2.0実行経路では未検出（本書7章）。

## 6. PC/SP分岐 と 顧客状態分岐

### 6.1 PC/SP（ブレークポイント）

| breakpoint | 出現数 | 位置づけ |
|------------|-------:|----------|
| `max-width: 900px` | 36 | **CWS2の主SP分岐点**。cws2-*レイヤーの標準 |
| `max-width: 520px` | 14 | 小型SP向け追加補正 |
| `max-width: 1100px` | 7 | タブレット〜小型PC |
| `max-width: 420px` | 6 | 極小端末 |
| `max-width: 620px` | 5 | カート系の中間補正 |
| `min-width: 901px` | 5 | PC専用指定（900pxの対） |
| `max-width: 768px` / `min-width: 769px` | 9 | **Impulse由来の旧分岐点** |

**要確認点**: `assets/cws2-cart-price-structure-v11.css` だけが Impulse 由来の `768/769px` を使い、
他のカートレイヤーは `900px` を使う。**769〜900px の帯**でカート商品行のグリッドだけ先にPC版へ切り替わり、
周囲のレイアウトはSP版のままになる区間が存在する。実機（iPad横・小型ノート）での確認が必要。

### 6.2 顧客状態（ログイン／会員種別）

会員種別は **customer tag** で表現され、3種類が実コードに存在する。

| タグ | 意味 | 実行経路での使用箇所 |
|------|------|----------------------|
| `001_syuhan` | 酒販店 | `easylockdown_head/filter_*`（限定商品・限定ブログの出し分け）, `templates/cart.liquid`（`attributes[アカウント種別]`に「酒販店」を書き込み） |
| `002_gyomu` | 業務店 | 同上（「業務店」） |
| `003_tokubetsu` | 特別会員 | `templates/cart.liquid`（「特別会員」） |
| （タグなし） | 一般 / ゲスト | 同上（「ゲスト」） |

**分岐の実装場所**

1. **EasyLockdown（サーバ側）** — `snippets/easylockdown_head.liquid`（22.5KB）が、
   特定 collection ID / product ID / blog ID に対し `customer` の有無と上記タグで
   404化・リダイレクト・リンク非表示を決定する。`easylockdownRender` の結果を `--elhResults--` 区切りで
   `layout/theme.liquid` に返し、`easylockdown_body` が `content_for_layout` を出すかどうかを決める。
2. **一覧のフィルタ** — `easylockdown_filter_search/collection/collections.liquid` が
   `{% continue %}` を返すことで、検索結果・コレクション一覧から該当商品を**ループ内で除外**する。
   `templates/search.cws2Count.liquid` と `collection.cws2AliasIndex/SearchIndex` も同じガードを通すため、
   **検索インデックスは顧客状態ごとに内容が変わる**（＝JSが取得するJSONも顧客ごとに異なる）。
3. **カート属性** — `templates/cart.liquid` が hidden input で `attributes[アカウント種別]` を出力し、注文データへ引き継ぐ。
4. **body class** — `layout/theme.liquid` が `cws2-utility-login` / `cws2-utility-account` / `cws2-utility-cart` を付与。
   MAINにあった `customer_login_available` / `customer_login_disable` は**廃止された**。

> **重要**: 2.0では MAIN の `body class="template-xxx"` が失われている。Impulse系CSS/JSは
> `template-*` を前提にしていたため、これも Impulse 経路を切ったことの帰結であり、意図的と判断できる。

### 8.5 カート構造上の観測事項

1. **`cws2-cart-summary-v1.css` が `@import` で layout-a〜d を二重ロードしている。**
   同ファイルが `cart.liquid` から直接も読まれるため、a/b/c/d のルールが**カスケードに2回入る**。
   実測では summary-v1 の自前selector（`.cws2-summary-row` 等）と重複しないため描画結果は変わらないが、
   往復リクエストと解析コストが二重になっており、今後 summary-v1 に a〜d と衝突する指定を足すと
   **直感と逆の結果**（後から読まれる直リンク側が勝つ）になる。`@import` の削除を推奨。
2. **`!important` の飽和**: カート13本で `!important` は合計 **577個**。
   後段4本（compact-v4 / ux-polish-v6 / lock-v10 / price-structure-v11）はほぼ全宣言が `!important` であり、
   次の修正は「さらに後ろのファイルを足す」以外に手段がない状態。これが v4→v5→v6→v10→v11 という
   ファイル増殖の原因そのものである。
3. **breakpointの不一致**: price-structure-v11 のみ `768/769px`、他は `900px`（§6.1）。
4. **`cws2-cart-qty-fast.js` がCSSを動的注入している**: `.cws2-flow` 系のスタイルを
   `document.createElement('style')` で `<head>` に追加するため、**どのCSSファイルよりも後**にカスケードされる。
   カートのステップナビ配色（`#86122b`）はCSSファイルではなくこのJS内にハードコードされている。

| `collection.cws2SearchIndex` | `cws2-search.js:99`, `cws2-search-exact-winery.js:32`, （`cws2-search-prefetch.js:8`） | 不要（`/collections/all?view=` で到達） | URL直打ちで誰でもJSON取得可 | なし | **実行経路あり / 削除不可** |
| `collection.cws2AliasIndex` | `cws2-search.js:180` | 同上 | 同上 | なし | **実行経路あり / 削除不可** |
| `collection.cws2MapIndex` | `snippets/cws2-discovery.liquid:1` | 同上 | 同上 | なし | **実行経路あり / 削除不可** |
| `collection.cws2SearchAudit` | **なし**（自ファイルのコメントに記載があるのみ） | 不要 | URL直打ちで取得可 | なし | 運用・監査用途（開発用） |
| `search.cws2Predictive` | **なし** | 不要 | 同上 | なし | 運用・監査用途 |
| `search.cws2Count` | **なし** | 不要 | 同上 | なし | 運用・監査用途。対になる `cws2-search-count.js` も未ロード |
| `search.cws2SyncProbe` | **なし** | — | 出力0バイト | — | **実行経路未検出（責務移管確認済み）**。ファイル内コメントが「同期用の墓標。このセッションのAPIから削除できないため残置」と明記 |
| `search.samitaLockSearch` | **なし** | 要Admin確認 | URL直打ちで**全商品の在庫数・SKU・価格を含むJSON**を取得可 | なし | 運用・監査用途。§11のリスク参照 |

> **noindexについて**: これらは `{%- layout none -%}` でJSONを返すため `<meta robots>` を出力できない。
> 検索エンジンからのインデックスを防ぐには `robots.txt.liquid`（現在テーマに存在しない）または
> Shopify側の設定が必要。**現状ではどのテンプレートもnoindex指定を持たない。**

> **顧客状態による内容差**: これらのテンプレートは全て `easylockdown_filter_*` を通すため、
> ログイン状態・会員タグによって返るJSONの中身が変わる。CDNキャッシュを挟むと**会員限定商品が
> 非会員に漏れる**可能性があるため、キャッシュ設定の確認が必要。

<nav class="pagination cws2-pagination" role="navigation" aria-label="ページ送り">
  {% if paginate.previous %}
    <span class="prev"><a href="{{ paginate.previous.url | replace: 'view=ajax', '' }}{{ hash }}" aria-label="前のページ">←</a></span>
  {% endif %}
  {% for part in paginate.parts %}
    {% if part.is_link %}
      <span class="page"><a href="{{ part.url | replace: 'view=ajax', '' }}{{ hash }}">{{ part.title }}</a></span>
    {% else %}
      {% if part.title == paginate.current_page %}
        <span class="page current">{{ part.title }}</span>
      {% else %}
        <span class="page">{{ part.title }}</span>
      {% endif %}
    {% endif %}
  {% endfor %}
  {% if paginate.next %}
    <span class="next"><a href="{{ paginate.next.url | replace: 'view=ajax', '' }}{{ hash }}" aria-label="次のページ">→</a></span>
  {% endif %}
</nav>

(function(){
  var root=document.querySelector('[data-cws2-helpbot]');
  if(!root)return;
  var toggle=root.querySelector('[data-cws2-helpbot-toggle]');
  var panel=root.querySelector('[data-cws2-helpbot-panel]');
  var close=root.querySelector('[data-cws2-helpbot-close]');
  function setOpen(open){
    panel.hidden=!open;
    toggle.setAttribute('aria-expanded',open?'true':'false');
  }
  toggle.addEventListener('click',function(){setOpen(panel.hidden);});
  if(close)close.addEventListener('click',function(){setOpen(false);});
  Array.prototype.forEach.call(root.querySelectorAll('a'),function(a){
    a.addEventListener('click',function(){setOpen(false);});
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false);});
  document.addEventListener('click',function(e){
    if(!panel.hidden && !root.contains(e.target))setOpen(false);
  });
})();

(function(){
  if(window.__cws2SearchPrefetchInstalled)return;
  window.__cws2SearchPrefetchInstalled=true;
  var nativeFetch=window.fetch&&window.fetch.bind(window);
  if(!nativeFetch)return;
  var cache={};
  function keyOf(input){try{return typeof input==='string'?input:(input&&input.url)||'';}catch(e){return '';}}
  function isIndex(url){return /\/collections\/all\?view=cws2SearchIndex&page=\d+/.test(url||'');}
  function pageUrl(url,n){return String(url).replace(/([?&]page=)\d+/,'$1'+n);}
  function cached(url,opts){
    if(!cache[url]){
      cache[url]=nativeFetch(url,opts).then(function(r){
        return r.text().then(function(t){return {body:t,status:r.status,statusText:r.statusText,headers:Array.from(r.headers.entries())};});
      });
    }
    return cache[url].then(function(x){return new Response(x.body,{status:x.status,statusText:x.statusText,headers:x.headers});});
  }
  window.fetch=function(input,opts){
    var url=keyOf(input);
    if(!isIndex(url))return nativeFetch(input,opts);
    var m=url.match(/[?&]page=(\d+)/);
    var page=m?parseInt(m[1],10):1;
    if(page>1&&cache[url])return cached(url,opts);
    return nativeFetch(input,opts).then(function(r){
      if(page!==1||!r.ok)return r;
      var clone=r.clone();
      clone.json().then(function(d){
        var pages=parseInt(d&&d.pages,10)||1;
        for(var i=2;i<=pages;i++){
          var u=pageUrl(url,i);
          if(!cache[u])cached(u,opts).catch(function(){});
        }
      }).catch(function(){});
      return r;
    });

})();

{%- comment -%}
CWS2 alias index.
  URL: /collections/all?view=cws2AliasIndex&page=N

Minimal, customer-aware source for search-alias resolution. Emits one row
per product that actually has a `cnw.search_alias` value, so the payload
carries only what alias resolution needs.

Guard order, identical to templates/collection.cws2SearchIndex.liquid:
  1. easylockdown_filter_collection   2. type != 'EVENT'   3. alias nonblank

Only title / handle / alias are emitted. No customer, tags, price,
inventory or entitlement data. `page` and `pages` let the client walk
every page, so a smaller server-side page cap only changes the number of
requests, never the result.
{%- endcomment -%}
{%- layout none -%}
{%- paginate collection.products by 1000 -%}
{
  "page": {{ paginate.current_page | json }},
  "pages": {{ paginate.pages | json }},
  "aliases": [
  {%- assign first_out = true -%}
  {%- for product in collection.products -%}
    {%- capture easylockdownFilter -%}{% render 'easylockdown_filter_collection' with product, easylockdownRender: true, easylockdownItemSelectorOff: easylockdownItemSelectorOff %}{%- endcapture -%}
    {%- assign easylockdownFilter = easylockdownFilter | strip -%}
    {%- unless easylockdownFilter == 'continue' -%}
    {%- unless product.type == 'EVENT' -%}
    {%- assign cws2Alias = product.metafields.cnw.search_alias.value | default: '' -%}
    {%- unless cws2Alias == blank -%}
      {%- unless first_out -%},{%- endunless -%}
      {%- assign first_out = false -%}
      {
        "title": {{ product.title | strip_html | json }},
        "handle": {{ product.handle | json }},
        "alias": {{ cws2Alias | json }}
      }
    {%- endunless -%}
    {%- endunless -%}
    {%- endunless -%}
  {%- endfor -%}
  ]
}
{%- endpaginate -%}
```

const src=document.getElementById('source').textContent;

function slug(s,i){return 's-'+i+'-'+s.replace(/<[^>]*>/g,'').replace(/[\s\W]+/g,'-').replace(/^-|-$/g,'').toLowerCase().slice(0,80)}
function render(md){
 const ls=md.split(/\r?\n/); let h='',i=0, inCode=false, lang='',buf=[], inUl=false,inOl=false;
 const closeLists=()=>{if(inUl){h+='</ul>';inUl=false} if(inOl){h+='</ol>';inOl=false}};
 for(let n=0;n<ls.length;n++){let l=ls[n];
   if(/^\`\`\`/.test(l)){ if(!inCode){closeLists();inCode=true;lang=l.replace(/^\`\`\`/,'').trim();buf=[]} else {const code=buf.join('\n'); if(lang==='mermaid'){h+='<div class="mermaid-wrap"><div class="mermaid">'+esc(code)+'</div></div>'} else {h+='<details class="code"><summary>'+inline(lang?lang+' — '+buf.length+' lines':'Source / diff — '+buf.length+' lines')+'</summary><pre><code>'+esc(code)+'</code></pre></details>'} inCode=false;lang='';buf=[]} continue}
   if(inCode){buf.push(l);continue}
   let m=l.match(/^(#{2,4})\s+(.+)$/); if(m){closeLists();const level=m[1].length;const id=slug(m[2],++i);h+='<h'+level+' id="'+id+'">'+inline(m[2])+'</h'+level+'>';continue}
   if(/^---+$/.test(l.trim())){closeLists();h+='<hr>';continue}
   if(/^>\s?/.test(l)){closeLists();h+='<blockquote>'+inline(l.replace(/^>\s?/,''))+'</blockquote>';continue}
   if(/^\s*[-*]\s+/.test(l)){if(!inUl){closeLists();h+='<ul>';inUl=true}h+='<li>'+inline(l.replace(/^\s*[-*]\s+/,''))+'</li>';continue}
   if(/^\s*\d+\.\s+/.test(l)){if(!inOl){closeLists();h+='<ol>';inOl=true}h+='<li>'+inline(l.replace(/^\s*\d+\.\s+/,''))+'</li>';continue}
   if(l.includes('|') && n+1<ls.length && /^\s*\|?\s*[-:]+/.test(ls[n+1])){closeLists();let rows=[l,ls[n+1]];let j=n+2;while(j<ls.length && ls[j].includes('|') && ls[j].trim()){rows.push(ls[j]);j++}const cells=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(v=>v.trim());const head=cells(rows[0]);h+='<table><thead><tr>'+head.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>';for(let r=2;r<rows.length;r++){h+='<tr>'+cells(rows[r]).map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>'}h+='</tbody></table>';n=j-1;continue}
   if(!l.trim()){closeLists();continue}

 }
