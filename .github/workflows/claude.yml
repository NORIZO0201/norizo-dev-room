name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 12
            --allowedTools "Bash(git:*),Bash(npm:*),Bash(pnpm:*),Bash(npx:*),Bash(node:*),Bash(python3:*),Bash(gh:*)"

      - name: Report wiring failure
        if: steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target="${{ github.event.issue.number || github.event.pull_request.number }}"
          gh issue comment "$target" --repo "${{ github.repository }}" --body "Claude Code GitHub Action was triggered, but the run failed before completing. Check the Actions run for authentication/setup details. This proves the GitHub trigger path is active; no NORIZO relay is required."
