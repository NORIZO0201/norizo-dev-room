name: Gemini Event Probe

on:
  issue_comment:
    types: [created]

jobs:
  probe:
    if: contains(github.event.comment.body, '@gemini-cli')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Prove GitHub event routing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "GEMINI_EVENT_PROBE_OK — GitHub received @gemini-cli and started an Actions job."
