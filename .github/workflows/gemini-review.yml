name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@gemini-cli') &&
       contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Resolve PR number
        id: context
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Acknowledge trigger
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "GEMINI_WIRING_TRIGGERED — GitHub event reached the Gemini review workflow. Starting Gemini CLI now."

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Gemini review
        id: gemini
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_pr_number: ${{ steps.context.outputs.pr }}
          prompt: |
            Read AGENTS.md, GEMINI.md, docs/PROJECT.md, docs/SPEC.md, docs/DECISIONS.md and docs/STATUS.md.
            Review this pull request as NORIZO DEV ROOM's independent auditor.
            Focus on acceptance criteria, regressions, security, secret exposure, unintended Production/ConoHa/Supabase/Vercel effects, and duplicate Sources of Truth.
            End with exactly:
            VERDICT: PASS | CHANGES_REQUESTED | NEEDS_HUMAN
            BLOCKERS:
            NON_BLOCKING:
            NEXT:

      - name: Publish Gemini result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr }}
          SUMMARY: ${{ steps.gemini.outputs.summary }}
          ERROR_TEXT: ${{ steps.gemini.outputs.error }}
          OUTCOME: ${{ steps.gemini.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ] && [ -n "$SUMMARY" ]; then
            body="## Gemini automated review

$SUMMARY"
          else
            body="GEMINI_WIRING_AUTH_OR_RUNTIME_FAILED — trigger wiring succeeded, but Gemini CLI did not complete.

- action outcome: $OUTCOME
- likely remaining gate: Gemini authentication / action runtime setup
- inspect the GitHub Actions job for the exact error"
          fi
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$body"
