name: DEV ROOM foundation QA

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'state/**'
      - 'qa/**'
      - 'scripts/validate-*.mjs'
      - 'package.json'
      - '.github/workflows/ops-lint.yml'
      - 'AGENTS.md'
      - 'docs/STATUS.md'
      - 'docs/NORIZO_LAB_OPERATING_CONSTITUTION.md'
  push:
    branches:
      - main
    paths:
      - 'contracts/**'
      - 'state/**'
      - 'qa/**'
      - 'scripts/validate-*.mjs'
      - 'package.json'
      - '.github/workflows/ops-lint.yml'
      - 'AGENTS.md'
      - 'docs/STATUS.md'
      - 'docs/NORIZO_LAB_OPERATING_CONSTITUTION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: P1-P5 canonical state
        run: node scripts/validate-phase-state.mjs

      - name: P3 browser QA contract
        run: node qa/selftest.mjs

      - name: P4 worker contract
        run: node qa/worker-state-selftest.mjs

      - name: P5 project gates
        run: |
          node scripts/validate-p5-gates.mjs
          node qa/p5-gates-selftest.mjs

      - name: Maintenance gate
        run: |
          node scripts/validate-maintenance-state.mjs
          node qa/maintenance-selftest.mjs

      - name: Retired infrastructure absence
        run: |
          test ! -e .mcp.json || ! grep -qi 'conoha' .mcp.json
          test ! -e scripts/setup-conoha-batch-host.sh
          test ! -e scripts/write-baseline.py
          test ! -e deploy/health
          test ! -e deploy/workers
          test ! -e docs/CONOHA_DEV_BASELINE.md
          test ! -e docs/INCIDENT_2026-09-21_EXECUTOR_STOP.md
          grep -q '"status": "retired"' state/DEV_ROOM_STATE.json
          grep -q '"scheduled_dev_room_watch_executor": false' state/DEV_ROOM_STATE.json
