name: Ops lint

on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/ops-lint.yml'
  push:
    branches:
      - 'ops/**'
      - 'integrate/**'
    paths:
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/ops-lint.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile deploy/health/health_server.py
          python3 -m py_compile scripts/write-baseline.py

      - name: Bash syntax
        run: |
          bash -n deploy/health/install-health-monitor.sh
          bash -n scripts/setup-conoha-batch-host.sh

      - name: ShellCheck
        run: |
          shellcheck deploy/health/install-health-monitor.sh
          shellcheck scripts/setup-conoha-batch-host.sh

      - name: systemd unit syntax
        run: |
          systemd-analyze verify deploy/health/norizo-health.service

      - name: Policy guard
        run: |
          if grep -RInE '@claude|@codex|claude-code-action|gemini-cli|norizo-claude-orchestrator|norizo-control-agent|norizo-p1-p5|norizo-supervisor' \
            --exclude-dir=.git .github deploy scripts; then
            echo "Retired AI dispatch/control-plane artifact detected." >&2
            exit 1
          fi
