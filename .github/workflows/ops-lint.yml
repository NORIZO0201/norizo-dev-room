name: DEV ROOM foundation QA

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'state/**'
      - 'qa/**'
      - 'scripts/validate-*.mjs'
      - 'scripts/write-baseline.py'
      - 'deploy/**'
      - 'package.json'
      - '.github/workflows/ops-lint.yml'
  push:
    branches:
      - main
    paths:
      - 'contracts/**'
      - 'state/**'
      - 'qa/**'
      - 'scripts/validate-*.mjs'
      - 'scripts/write-baseline.py'
      - 'deploy/**'
      - 'package.json'
      - '.github/workflows/ops-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: P1-P5 canonical state
        run: node scripts/validate-phase-state.mjs

      - name: P3 browser QA contract
        run: node qa/selftest.mjs

      - name: P4 worker contract
        run: node qa/worker-state-selftest.mjs

      - name: P5 project gates
        run: |
          node scripts/validate-p5-gates.mjs
          node qa/p5-gates-selftest.mjs

      - name: Maintenance gate
        run: |
          node scripts/validate-maintenance-state.mjs
          node qa/maintenance-selftest.mjs

      - name: Retired infrastructure policy
        run: |
          test ! -e .mcp.json || ! grep -qi 'conoha' .mcp.json
          grep -q '"status": "retired"' state/DEV_ROOM_STATE.json
          grep -q '"conoha_touched": false' state/MAINTENANCE_OBSERVATION.json
          grep -q '^RETIRED:' deploy/health/install-health-monitor.sh
          grep -q '^RETIRED:' deploy/workers/install-omnw-resident-workers.sh
          grep -q 'Retired tombstone' scripts/write-baseline.py
          ! grep -q 'systemctl' deploy/health/install-health-monitor.sh
          ! grep -q 'systemctl' deploy/workers/install-omnw-resident-workers.sh
          ! grep -q 'subprocess' scripts/write-baseline.py
